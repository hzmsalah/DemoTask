services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: shaghaf-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      sqlserver-data-permissions:
        condition: service_completed_successfully
    networks:
      - shaghaf-network

  sqlserver-data-permissions:
    image: mcr.microsoft.com/mssql/server:2025-latest
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown -R 10001:0 /var/opt/mssql/data"]
    volumes:
      - sqlserver-data:/var/opt/mssql/data

  backend:
    image: ghcr.io/hzmsalah/demotask-api:latest
    container_name: shaghaf-api
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${MSSQL_DB_NAME:-ShaghafDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Cors__AllowedOrigins__0=http://localhost:${UI_PORT:-3000}
      - Cors__AllowedOrigins__1=http://localhost:5173
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - shaghaf-network

  frontend:
    image: ghcr.io/hzmsalah/demotask-frontend:latest
    container_name: shaghaf-ui
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - shaghaf-network

networks:
  shaghaf-network:
    driver: bridge

volumes:
  sqlserver-data:
